[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
dynamic = ["version"]
description = "Let Claude Code and Antigravity talk to each other through their CLIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
abr = "agent_bridge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agent_bridge.__version__" }

[tool.setuptools.packages.find]
include = ["agent_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
